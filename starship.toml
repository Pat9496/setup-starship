[fill]
symbol = " "

[custom.fedora]
command = "printf '󰣛'"
when = "grep -Eqi '^ID=fedora' /etc/os-release && ! grep -Eqi '^VARIANT_ID=bazzite|bazzite' /etc/os-release"
style = "bold #3c6eb4"
format = "[$output]($style) "

[custom.bazzite]
command = "printf '󰣛'"
when = "grep -Eqi '^ID=bazzite|^VARIANT_ID=bazzite|bazzite' /etc/os-release"
style = "bold #7b2ff7"
format = "[$output]($style) "

[custom.ubuntu]
command = "printf '󰕈'"
when = "grep -Eqi '^ID=ubuntu' /etc/os-release"
style = "bold #e95420"
format = "[$output]($style) "

[custom.debian]
command = "printf '󰣚'"
when = "grep -Eqi '^ID=debian' /etc/os-release"
style = "bold #ce0056"
format = "[$output]($style) "

[custom.arch]
command = "printf ''"
when = "grep -Eqi '^ID=arch' /etc/os-release"
style = "bold #1793d1"
format = "[$output]($style) "

[custom.opensuse]
command = "printf ''"
when = "grep -Eqi '^ID=(opensuse|opensuse-tumbleweed|opensuse-leap)' /etc/os-release"
style = "bold #73ba25"
format = "[$output]($style) "

[custom.linux]
command = "printf '󰌽'"
when = "! grep -Eqi '^ID=(fedora|bazzite|ubuntu|debian|arch|opensuse|opensuse-tumbleweed|opensuse-leap)|^VARIANT_ID=bazzite|bazzite' /etc/os-release"
style = "bold #dfefff"
format = "[$output]($style) "

[custom.hostname_fedora]
command = "cat /proc/sys/kernel/hostname"
when = "grep -Eqi '^ID=fedora' /etc/os-release && ! grep -Eqi '^VARIANT_ID=bazzite|bazzite' /etc/os-release"
style = "#2d5387"
format = "[@$output ]($style)"

[custom.hostname_bazzite]
command = "cat /proc/sys/kernel/hostname"
when = "grep -Eqi '^ID=bazzite|^VARIANT_ID=bazzite|bazzite' /etc/os-release"
style = "#5c23b9"
format = "[@$output ]($style)"

[custom.hostname_ubuntu]
command = "cat /proc/sys/kernel/hostname"
when = "grep -Eqi '^ID=ubuntu' /etc/os-release"
style = "#af3f18"
format = "[@$output ]($style)"

[custom.hostname_debian]
command = "cat /proc/sys/kernel/hostname"
when = "grep -Eqi '^ID=debian' /etc/os-release"
style = "#9b0041"
format = "[@$output ]($style)"

[custom.hostname_arch]
command = "cat /proc/sys/kernel/hostname"
when = "grep -Eqi '^ID=arch' /etc/os-release"
style = "#116e9d"
format = "[@$output ]($style)"

[custom.hostname_opensuse]
command = "cat /proc/sys/kernel/hostname"
when = "grep -Eqi '^ID=(opensuse|opensuse-tumbleweed|opensuse-leap)' /etc/os-release"
style = "#568c1c"
format = "[@$output ]($style)"

[custom.hostname_linux]
command = "cat /proc/sys/kernel/hostname"
when = "! grep -Eqi '^ID=(fedora|bazzite|ubuntu|debian|arch|opensuse|opensuse-tumbleweed|opensuse-leap)|^VARIANT_ID=bazzite|bazzite' /etc/os-release"
style = "#a7b3bf"
format = "[@$output ]($style)"

[custom.toolbox]
command = '''
name=$(sed -n 's/^name="\(.*\)"$/\1/p' /run/.containerenv 2>/dev/null)
if [ -n "$name" ]; then
  printf '󱂬 toolbox: %s' "$name"
else
  printf '󱂬 toolbox'
fi
'''
when = '[ -n "${TOOLBOX_PATH:-}" ]'
style = "bold toolbox_dark_blue"
format = "[$output ]($style)"

[custom.distrobox]
command = '''
name="${DBX_CONTAINER_NAME:-}"
if [ -z "$name" ]; then
  name=$(sed -n 's/^name="\(.*\)"$/\1/p' /run/.containerenv 2>/dev/null)
fi
if [ -n "$name" ]; then
  printf '󰦭 distrobox: %s' "$name"
else
  printf '󰦭 distrobox'
fi
'''
when = '[ -z "${TOOLBOX_PATH:-}" ] && { [ -n "${DISTROBOX_ENTER_PATH:-}" ] || [ -n "${DBX_CONTAINER_NAME:-}" ] || grep -qi distrobox /run/.containerenv 2>/dev/null; }'
style = "bold distrobox_violet"
format = "[$output ]($style)"

[custom.podman]
command = '''
name=$(sed -n 's/^name="\(.*\)"$/\1/p' /run/.containerenv 2>/dev/null)
if [ -n "$name" ]; then
  printf ' podman: %s' "$name"
else
  printf ' podman'
fi
'''
when = '[ -z "${TOOLBOX_PATH:-}" ] && [ -z "${DISTROBOX_ENTER_PATH:-}" ] && [ -z "${DBX_CONTAINER_NAME:-}" ] && [ -f /run/.containerenv ]'
style = "bold podman_purple"
format = "[$output ]($style)"

[custom.docker]
command = "printf '󰡨 docker'"
when = '[ -z "${TOOLBOX_PATH:-}" ] && [ -z "${DISTROBOX_ENTER_PATH:-}" ] && [ -z "${DBX_CONTAINER_NAME:-}" ] && [ -f /.dockerenv ]'
style = "bold docker_blue"
format = "[$output ]($style)"

[custom.root_symbol]
command = "printf '󰌾'"
when = '[ "$(id -u)" -eq 0 ]'
style = "bold red"
format = "[$output]($style) "

[custom.toolbox_symbol]
command = "printf '󱂬'"
when = '[ -n "${TOOLBOX_PATH:-}" ]'
style = "bold toolbox_dark_blue"
format = "[$output]($style) "

[custom.distrobox_symbol]
command = "printf '󰦭'"
when = '[ -z "${TOOLBOX_PATH:-}" ] && { [ -n "${DISTROBOX_ENTER_PATH:-}" ] || [ -n "${DBX_CONTAINER_NAME:-}" ] || grep -qi distrobox /run/.containerenv 2>/dev/null; }'
style = "bold container_violet"
format = "[$output]($style) "

[custom.podman_symbol]
command = "printf ''"
when = '[ -z "${TOOLBOX_PATH:-}" ] && [ -z "${DISTROBOX_ENTER_PATH:-}" ] && [ -z "${DBX_CONTAINER_NAME:-}" ] && [ -f /run/.containerenv ]'
style = "bold podman_purple"
format = "[$output]($style) "

[custom.docker_symbol]
command = "printf '󰡨'"
when = '[ -z "${TOOLBOX_PATH:-}" ] && [ -z "${DISTROBOX_ENTER_PATH:-}" ] && [ -z "${DBX_CONTAINER_NAME:-}" ] && [ -f /.dockerenv ]'
style = "bold docker_blue"
format = "[$output]($style) "

[custom.mosh_symbol]
command = "printf '󰒍'"
when = '[ -n "${MOSH_IP:-}" ]'
style = "bold mosh_cyan"
format = "[$output]($style) "

[custom.ssh_symbol]
command = "printf '󰣀'"
when = '[ -z "${MOSH_IP:-}" ] && { [ -n "${SSH_CONNECTION:-}" ] || [ -n "${SSH_CLIENT:-}" ]; }'
style = "bold ssh_green"
format = "[$output]($style) "

[username]
show_always = true
style_user = "bold username_color"
style_root = "bold red"
format = "[$user]($style)"

[directory]
style = "bold directory_color"
home_symbol = "~"
truncation_length = 6
truncation_symbol = "…/"
truncate_to_repo = false
read_only = "󰌾 "
format = "[ 󰉋 $path$read_only  ]($style)"

[git_branch]
symbol = "󰘬 "
style = "bold green"
format = "[$symbol$branch ]($style)"

[git_commit]
tag_disabled = false
only_detached = true
style = "bold yellow"
format = "[󰜘 $hash$tag ]($style)"

[git_state]
style = "bold yellow"
format = "[󰘭 $state( $progress_current/$progress_total) ]($style)"

[git_status]
style = "yellow"
format = "[$all_status$ahead_behind ]($style)"
conflicted = " ${count} "
ahead = "󰜷${count} "
behind = "󰜮${count} "
diverged = "󰯎󰜷${ahead_count}󰜮${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "󱎘${count} "

[terraform]
symbol = "󱁢 "
style = "bold cyan"
format = "[$symbol$workspace ]($style)"

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold blue"
format = "[$symbol$context/$namespace ]($style)"

[azure]
disabled = false
symbol = "󰠅 "
style = "bold blue"
format = "[$symbol$subscription ]($style)"

[container]
disabled = true

[shlvl]
disabled = false
threshold = 3
symbol = "󰞷 "
style = "bold yellow"
format = "[$symbol$shlvl ]($style)"

[jobs]
symbol = "󰒓 "
style = "bold cyan"
format = "[$symbol$number ]($style)"

[cmd_duration]
min_time = 1000
style = "bright_black"
format = "[󱎫 $duration ]($style)"

[status]
disabled = false
symbol = "󱎘 "
style = "bold red"
format = "[$symbol$status ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bright_black"
format = "[󰥔 $time ]($style)"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[←](bold yellow)"
