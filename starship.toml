format = """
${custom.fedora}${custom.bazzite}${custom.ubuntu}${custom.debian}${custom.arch}${custom.opensuse}${custom.linux}$username${custom.hostname_fedora}${custom.hostname_bazzite}${custom.hostname_ubuntu}${custom.hostname_debian}${custom.hostname_arch}${custom.hostname_opensuse}${custom.hostname_linux}$directory$git_branch$git_commit$git_state$git_status$terraform$kubernetes$azure${custom.toolbox}${custom.distrobox}${custom.podman}${custom.docker}$shlvl$jobs$fill$cmd_duration$status$time
${custom.root_symbol}${custom.toolbox_symbol}${custom.distrobox_symbol}${custom.podman_symbol}${custom.docker_symbol}${custom.mosh_symbol}${custom.ssh_symbol}$character"""

